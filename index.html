<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DGNSEC | SYSTEM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        /* Brilho discreto no fundo */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.08),
                    transparent 55%
                );
            pointer-events: none;
        }

        .main {
            position: relative;
            z-index: 2;

            min-height: 100vh;
            width: 100%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;
        }

        /* FOTO */
        .profile-img {
            width: min(70vw, 360px);
            height: auto;

            border: 1px solid #fff;
            border-radius: 4px;

            box-shadow:
                0 0 10px rgba(255,255,255,0.8),
                0 0 30px rgba(255,255,255,0.35),
                0 0 60px rgba(255,255,255,0.15);

            animation: imageGlow 3s ease-in-out infinite;
        }

        @keyframes imageGlow {
            0%, 100% {
                box-shadow:
                    0 0 10px rgba(255,255,255,0.8),
                    0 0 30px rgba(255,255,255,0.35);
            }

            50% {
                box-shadow:
                    0 0 18px rgba(255,255,255,1),
                    0 0 45px rgba(255,255,255,0.5);
            }
        }

        /* TÍTULO */
        h1 {
            margin: 25px 0 8px;

            font-size: clamp(2rem, 7vw, 4rem);
            letter-spacing: 8px;

            color: #fff;

            text-shadow:
                0 0 5px #fff,
                0 0 15px rgba(255,255,255,0.8),
                0 0 30px rgba(255,255,255,0.4);

            animation: glitch 4s infinite;
        }

        @keyframes glitch {
            0%, 94%, 100% {
                transform: translate(0);
            }

            95% {
                transform: translate(-2px, 1px);
            }

            96% {
                transform: translate(2px, -1px);
            }

            97% {
                transform: translate(0);
            }
        }

        .subtitle {
            color: #aaa;
            font-size: clamp(0.8rem, 3vw, 1.1rem);
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        /* TERMINAL */
        .terminal {
            width: min(90vw, 500px);

            border: 1px solid #555;
            background: rgba(0,0,0,0.75);

            padding: 15px;

            text-align: left;

            box-shadow:
                0 0 15px rgba(255,255,255,0.15);

            font-size: 0.85rem;
        }

        .line {
            margin: 6px 0;
            color: #ddd;
        }

        .white {
            color: #fff;
        }

        .gray {
            color: #777;
        }

        /* LINHA INFERIOR */
        .footer {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;

            text-align: center;

            color: #555;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {

            .profile-img {
                width: 65vw;
                max-width: 280px;
            }

            h1 {
                letter-spacing: 5px;
            }

            .terminal {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <main class="main">

        <!-- SUA FOTO -->
        <img
            class="profile-img"
            src="InShot_20260826_024103658.jpg"
            alt="DGNSEC"
        >

        <!-- TÍTULO -->
        <h1>DGNSEC</h1>

        <div class="subtitle">
            NOVA GERAÇÃO DO CIBERCRIME
        </div>

        <!-- TERMINAL FICTÍCIO -->
        <div class="terminal">

            <div class="line">
                <span class="white">$ SISTEMA:</span> ONLINE
            </div>

            <div class="line">
                <span class="white">$ MÓDULOS:</span> ATIVOS
            </div>

            <div class="line">
                <span class="white">$ IP:</span> LOCALIZANDO...
            </div>

            <div class="line">
                <span class="white">$ PROXY:</span> ATIVO
            </div>

            <div class="line gray">
                $ DRAGONWARE INICIANDO...
            </div>

        </div>

    </main>

    <div class="footer">
        DGNSEC • 0xDGNWARE • 0DAY
    </div>

</body>
</html>
